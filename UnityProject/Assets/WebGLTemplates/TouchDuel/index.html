<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0e1a20; color: #eef5f1; font: 16px system-ui, sans-serif; }
    body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #unity-canvas { display: block; width: 100%; height: 100%; height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)); outline: none; touch-action: none; }
    #loading, #error { position: fixed; inset: 0; display: grid; place-content: center; gap: 16px; padding: 28px; text-align: center; background: #0e1a20; }
    #loading strong { font-size: 24px; } progress { width: min(320px, 75vw); accent-color: #55c8a7; }
    #error { display: none; } #rotate { display: none; position: fixed; inset: 0; background: #0e1a20eb; place-content: center; padding: 24px; text-align: center; pointer-events: none; font-size: 22px; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: grid; } }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="0" aria-label="{{{ PRODUCT_NAME }}} – spielbarer Brawler"></canvas>
  <div id="loading"><strong>{{{ PRODUCT_NAME }}}</strong><span>Spiel wird geladen …</span><progress max="1" value="0"></progress></div>
  <div id="error" role="alert"></div>
  <div id="rotate">Für den Kampf bitte quer halten.</div>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    function showError(message) { const error = document.getElementById('error'); error.textContent = message; error.style.display = 'grid'; loading.style.display = 'none'; }
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('pointerdown', () => canvas.focus({preventScroll:true}));
    const config = {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}', frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}', codeUrl: 'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets', companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}}, productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, matchMedia('(pointer:coarse)').matches ? 1.5 : 2),
      showBanner: (message, type) => { if (type === 'error') showError(message); else console.warn(message); }
    };
    const script = document.createElement('script'); script.src = 'Build/{{{ LOADER_FILENAME }}}';
    script.onerror = () => showError('Spiel konnte nicht geladen werden. Bitte Seite neu laden.');
    script.onload = () => createUnityInstance(canvas, config, progress => { loading.querySelector('progress').value = progress; })
      .then(() => { loading.style.display = 'none'; canvas.focus({preventScroll:true}); })
      .catch(showError);
    document.body.appendChild(script);
  </script>
</body>
</html>
