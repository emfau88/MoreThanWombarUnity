name: Publish playable WebGL game

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release containing webgl-duel.zip parts (empty uses latest)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download built game
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          args=()
          if [ -n "$RELEASE_TAG" ]; then args+=("$RELEASE_TAG"); fi
          gh release download "${args[@]}" --pattern 'webgl-duel.zip.part-*'
          cat webgl-duel.zip.part-* > webgl-duel.zip
          unzip -q webgl-duel.zip -d public
          test -f public/index.html
          test -d public/Build
          touch public/.nojekyll
          # Keep an older browser/CDN loader from opening newer compressed assets.
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('public')
          revision = json.loads((root / 'version.json').read_text(encoding='utf-8-sig'))['commit']
          page = root / 'index.html'
          html = page.read_text(encoding='utf-8-sig')
          for asset in (root / 'Build').iterdir():
              if asset.is_file():
                  html = html.replace(f"Build/{asset.name}'", f"Build/{asset.name}?v={revision}'")
          page.write_text(html, encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
